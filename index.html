<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="src/assets/img/favicon/favicon.ico">
    <link rel="stylesheet" type="text/css" href="src/css/styles.css">
    <title>Mecani Chatbot</title>

    <script src="src/js/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="src/js/chatbotUI.js"></script>
</head>

<body>
    <div class="content">
        <!--Barra lateral-->
        <div class="lateral" id="sidebar">
            <button id="close-sidebar" class="mobile-only">&times;</button>
            <div id="presentacion">
                <a href="https://utp.edu.co/" target="_blank">
                    <img src="src/assets/img/favicon/logoUTP.png" alt="Logo UTP" id="sidebar-logoutp">
                </a>
            </div>

            <div class="sidebar-divider">
                <span data-i18n="sidebar_actions">Acciones</span>
            </div>

            <div id="chats">
                <ul>
                    <li>
                        <button class="accion-btn" id="limpiar-chat">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            <span data-i18n="action_clear">Limpiar chat</span>
                        </button>
                    </li>
                    <li>
                        <button class="accion-btn" id="compartir-enlace">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                            <span data-i18n="action_share">Compartir enlace</span>
                        </button>
                    </li>
                    <li>
                        <button class="accion-btn" id="wsp">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                            </svg>
                            <span data-i18n="action_support">Soporte</span>
                        </button>
                    </li>
                    <li>
                        <button class="accion-btn" id="exportar-pdf">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <span data-i18n="action_export">Exportar chat</span>
                        </button>
                    </li>
                </ul>
            </div>

            <div class="sidebar-footer">
                <select id="language-selector" class="lang-select">
                    <option value="es">🇪🇸 Español</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="fr">🇫🇷 Français</option>
                </select>
            </div>

            <div id="credits">
                <h4>Hecho por <a href="https://www.linkedin.com/in/sebastianruizzuluaga-ingenieur/es/"
                        target="_blank">Sebastián Ruiz</a> &copy;</h4>
            </div>
        </div>

        <!-- Mobile Overlay -->
        <div id="mobile-overlay"></div>

        <!--Inicio del main board-->
        <!--Barra superior con logos-->
        <div class="board">
            <div id="titular">
                <div class="header-left">
                    <button id="sidebar-toggle-btn" class="toggle-btn" title="Abrir/Cerrar menú de acciones">
                        <svg class="toggle-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button id="hamburger-menu" class="mobile-only">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="app-logo">
                        <img src="src/assets/img/favicon/logo_mecani_v2.png" alt="Mecani">
                    </div>
                    <h2><span class="gradient-text">Mecani</span></h2>
                    <div class="status-badge">
                        <span class="status-dot"></span><span data-i18n="status_online">En línea - RAG Activo</span>
                    </div>
                </div>

                <div class="header-right">
                    <div id="logos">
                        <a href="https://tecnologia.utp.edu.co/ingenieria-mecatronica/" target="_blank"><img
                                src="src/assets/img/favicon/logoMecatronica.png" alt="IngMecatronica"
                                id="logomecatronica"></a>
                    </div>
                </div>
            </div>
            <!--Fin de la barra superior con logos-->

            <!--Inicio de la estructura de chat-->
            <div id="chat">

            </div>
            <!--Fin de la estructura de chat-->

            <!-- Input -->
            <div id="campo-de-texto">
                <form action="">
                    <div id="divInput">
                        <input type="text" placeholder="Pregúntale a Mecani sobre Mecatrónica UTP..." autocomplete="off" id="text" data-i18n-placeholder="input_placeholder">
                    </div>
                    <div id="divButton">
                        <button id="enviar" disabled aria-label="Enviar mensaje">
                            <svg class="send-svg" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>
</body>

</html>
